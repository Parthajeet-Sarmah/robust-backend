<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bomboclat Auth Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f9f9f9;
      --border: #1f1f1f;
      --accent: #ffffff;
      --radius: 0.75rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
      filter: blur(120px);
      border-radius: 50%;
      animation: float 12s ease-in-out infinite alternate;
    }

    .glow:nth-child(1) {
      top: -100px;
      left: -150px;
    }

    .glow:nth-child(2) {
      bottom: -100px;
      right: -150px;
      animation-delay: 3s;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) translateX(0px);
      }

      100% {
        transform: translateY(-40px) translateX(40px);
      }
    }

    .container {
      z-index: 2;
      text-align: center;
    }

    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      padding: 1rem 2.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.98);
    }

    .label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 1rem;
    }

    .success {
      margin-top: 1.5rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .success.visible {
      opacity: 1;
      color: #00ff90;
    }

    .error.visible {
      color: #ff4b4b;
    }
  </style>

</head>

<body>
  <div class="glow"></div>
  <div class="glow"></div>

  <div class="container">
    <button id="loginButton">Login with Bomboclat Auth</button>
    <button id="logoutButton" style="margin-top:20px; display:none;">Logout</button>
    <div class="label">Secure OAuth 2.0 + OIDC Authorization</div>
    <div class="success" id="successMsg">✅ Logged in successfully!</div>
    <div class="success error" id="errorMsg">❌ Login failed or canceled.</div>
  </div>

  <script>
    async function hashToken256(token) {
      const data = new TextEncoder().encode(token);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      let binary = "";
      const bytes = new Uint8Array(hashBuffer);
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const base64 = btoa(binary);
      return base64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");

    // ------------------------------
    // OIDC CONFIG — replace with yours
    // ------------------------------
    const OIDC_END_SESSION_ENDPOINT = "http://localhost:9030/sessions/end_session";
    const POST_LOGOUT_REDIRECT_URI = "http://localhost:5500/logged-out.html";

    const CLIENT_ID = "56f6e95e-d1d5-40e9-b2bf-b50e9262abd7";
    const CLIENT_SECRET = "password";
    const CODE_VERIFIER = "localhost";
    const CODE_CHALLENGE_METHOD = "S256";
    const REDIRECT_URI = "http://localhost:5500/oauth/callback.html";
    const SCOPE = "openid profile email";


    // ==========================================
    // LOGIN FLOW (POPUP)
    // ==========================================
    loginButton.addEventListener("click", async () => {
      successMsg.classList.remove("visible");
      errorMsg.classList.remove("visible");

      const width = 480, height = 640;
      const left = (screen.width / 2) - (width / 2);
      const top = (screen.height / 2) - (height / 2);

      const state = "hello123";
      const codeVerifier = await hashToken256("localhost");
      const codeChallengeMethod = "S256";

      const authUrl =
        `http://localhost:9000/authorize?client_id=${CLIENT_ID}`
        + `&client_secret=${CLIENT_SECRET}`
        + `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`
        + `&scope=${encodeURIComponent(SCOPE)}`
        + `&random_state=${state}`
        + `&code_challenge=${codeVerifier}`
        + `&code_challenge_method=${codeChallengeMethod}`;

      const popup = window.open(
        authUrl,
        "BomboclatAuthWindow",
        `width=${width},height=${height},top=${top},left=${left}`
      );

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;

        if (event.data.type === "bomboclat-auth-success") {
          const {code, state: returnedState, id_token, session_state} = event.data;

          if (returnedState !== state) {
            errorMsg.textContent = "⚠️ State mismatch — possible CSRF.";
            errorMsg.classList.add("visible");
            return;
          }

          localStorage.setItem("session_state", session_state)

          const params = new URLSearchParams();
          params.append("client_id", CLIENT_ID);
          params.append("client_secret", CLIENT_SECRET);
          params.append("code_verifier", CODE_VERIFIER);
          params.append("code_challenge_method", CODE_CHALLENGE_METHOD);
          params.append("code", code);
          params.append("redirect_uri", REDIRECT_URI);
          params.append("grant_type", "authorization_code");

          fetch("http://localhost:9000/authorize/token", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "Authorization": `Basic NzQ0ZDU3M2EtZjM2Ny00ZjM4LTgzMzItNTA1YjYyZGY0Y2Y5OmFzZA==`
            },
            body: params
          })
            .then(res => res.json())
            .then(tokens => {

              // Store what_logout_needs
              localStorage.setItem("id_token", tokens.idToken);
              localStorage.setItem("access_token", tokens.accessToken);
              localStorage.setItem("refresh_token", tokens.refreshToken);

              successMsg.classList.add("visible");
              logoutButton.style.display = "inline-block";

              //Add iframes
              const rpIframe = document.createElement("iframe");
              rpIframe.id = "rp"
              rpIframe.style = "pointer-events: none; position: absolute;width:0;height:0;border:0;";
              rpIframe.src = "login-status.html";

              const opIframe = document.createElement("iframe");
              opIframe.id = "op"
              opIframe.style = "pointer-events: none; position: absolute;width:0;height:0;border:0;";
              opIframe.src = "http://localhost:9030/sessions/check";

              document.body.appendChild(rpIframe);
              document.body.appendChild(opIframe);

              if (popup) popup.close();
            })
            .catch(err => {
              console.error("Token exchange failed:", err);
              errorMsg.textContent = "❌ Token exchange failed.";
              errorMsg.classList.add("visible");
            });
        }

        if (event.data.type === "bomboclat-auth-error") {
          errorMsg.textContent = event.data.message || "❌ Login failed.";
          errorMsg.classList.add("visible");
          if (popup) popup.close();
        }
      });
    });


    // ==========================================
    // OIDC LOGOUT FLOW
    // ==========================================
    logoutButton.addEventListener("click", () => {

      const idToken = localStorage.getItem("id_token");
      localStorage.removeItem("id_token");

      if (!idToken) {
        alert("No ID token found — cannot perform OIDC logout.");
        return;
      }

      fetch(`${OIDC_END_SESSION_ENDPOINT}?id_token_hint=${idToken}`, {
        credentials: "include"
      })
      // Build OIDC logout URL
      //const logoutUrl =
      //  `${OIDC_END_SESSION_ENDPOINT}`
      //  + `?id_token_hint=${encodeURIComponent(idToken)}`
      //  + `&post_logout_redirect_uri=${encodeURIComponent(POST_LOGOUT_REDIRECT_URI)}`;

      //// Redirect browser — MUST be full navigation
      //window.location.href = logoutUrl;
    });

  </script>

</body>

</html>

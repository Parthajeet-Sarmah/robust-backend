<script>

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  function deleteCookie(name, path, domain) {
    if (getCookie(name)) {
      document.cookie = name + "=" +
        ((path) ? ";path=" + path : "") +
        ((domain) ? ";domain=" + domain : "") +
        ";expires=Thu, 01 Jan 1970 00:00:01 GMT";
    }
  }

  const CLIENT_ID = "56f6e95e-d1d5-40e9-b2bf-b50e9262abd7";
  const SESSION_STATE = localStorage.getItem("session_state");

  var stat = "unchanged";
  var mes = CLIENT_ID + " " + SESSION_STATE;
  var targetOrigin = "http://localhost:9030"; // Validates origin
  var opFrameId = "op";
  var timerID;

  function check_session() {
    var win = window.parent.frames[opFrameId].contentWindow
    win.postMessage(mes, targetOrigin);
  }

  function setTimer() {
    check_session();
    timerID = setInterval(check_session, 5 * 1000);
  }

  window.addEventListener("message", receiveMessage, false);

  function receiveMessage(e) {

    if (e.origin !== targetOrigin) {
      return;
    }
    stat = e.data;

    if (stat === "changed") {
      clearInterval(timerID);
      // then take the actions below...
      parent = window.parent.document;

      const logoutButton = parent.getElementById("logoutButton")
      const successMsg = parent.getElementById("successMsg");

      logoutButton.style.display = "none";
      successMsg.textContent = "Logged out successfully!";
      successMsg.classList.add("visible");
    }
  }

  setTimer();
</script>
